name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Card content is derived from each project's README at build time
  # (scripts/sync-readmes.mjs), so a nightly rebuild keeps the site from
  # drifting more than a day behind a repo even with no commits here.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The ledger reads bare clones of every public repository
      # (scripts/sync-receipts.mjs). Kept between runs so a build only
      # fetches what changed instead of cloning ~200 MB each time.
      - uses: actions/cache@v4
        with:
          path: .cache/receipts
          key: receipts-git-${{ github.run_id }}
          restore-keys: |
            receipts-git-
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
