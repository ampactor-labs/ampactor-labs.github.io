<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<title>keep</title>
<style>
  /* Patina Dark, the values from public/tokens.css. Inlined so the gate
     renders even if the token sheet moves. State rides amber (warm) and
     steel (cool), never coral/verdigris, which collapse for a deuteranope. */
  :root {
    --void:      #0f0e0d;
    --charcoal:  #1d2021;
    --umber:     #45403d;
    --comment:   #5a524c;
    --muted:     #a89984;
    --parchment: #d4be98;
    --amber:     #d8a657;
    --steel:     #6a95a8;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--parchment);
    font-family: var(--mono);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  /* The one flourish: a slow phosphor breath, the site's CRT language at rest. */
  .glow {
    position: fixed;
    inset: -30%;
    z-index: 0;
    background: radial-gradient(circle at 50% 46%, rgba(216, 166, 87, 0.10), transparent 42%);
    animation: breathe 11s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.06); }
  }

  .gate {
    position: relative;
    z-index: 1;
    width: min(24rem, calc(100vw - 3rem));
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    padding-bottom: 12vh;
  }
  .mark {
    font-size: 0.6875rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--comment);
    text-align: center;
  }
  form { display: flex; flex-direction: column; gap: 0.75rem; }
  .field {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.85rem 1rem;
    background: var(--charcoal);
    border: 1px solid var(--umber);
    border-radius: 2px;
    transition: border-color 200ms ease, box-shadow 200ms ease;
  }
  .field:focus-within {
    border-color: var(--amber);
    box-shadow: 0 0 0 1px rgba(216, 166, 87, 0.25), 0 0 18px rgba(216, 166, 87, 0.12);
  }
  .field::before { content: "·"; color: var(--amber); }
  input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--parchment);
    font: inherit;
    font-size: 1rem;
    letter-spacing: 0.18em;
  }
  input::placeholder { color: var(--comment); letter-spacing: 0.08em; }
  button {
    padding: 0.8rem;
    background: none;
    border: 1px solid var(--umber);
    border-radius: 2px;
    color: var(--muted);
    font: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease;
  }
  button:hover:not(:disabled) { color: var(--parchment); border-color: var(--comment); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button:disabled { color: var(--comment); cursor: default; }

  .say {
    min-height: 1.3rem;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-align: center;
    color: var(--comment);
  }
  .say.warm { color: var(--amber); }
  .say.cool { color: var(--steel); }
  .shake { animation: shake 300ms ease; }
  @keyframes shake {
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .list { display: none; flex-direction: column; gap: 2px; }
  .list a {
    padding: 0.85rem 1rem;
    background: var(--charcoal);
    border-left: 2px solid var(--steel);
    color: var(--parchment);
    font-size: 0.875rem;
    text-decoration: none;
  }
  .list a:hover { background: var(--umber); }

  iframe {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    border: none;
    background: var(--charcoal);
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .shake { animation: none; }
  }
</style>
</head>
<body>
<div class="glow"></div>

<main class="gate" id="gate">
  <p class="mark">keep</p>
  <form id="form">
    <label class="field">
      <input id="pass" type="password" placeholder="passphrase" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </label>
    <button id="go" type="submit">Open</button>
  </form>
  <p class="say" id="say"></p>
  <nav class="list" id="list"></nav>
</main>

<iframe id="frame" title="keep"></iframe>

<script>
  const $ = (id) => document.getElementById(id);
  const say = (msg, tone = "") => { $("say").textContent = msg; $("say").className = "say " + tone; };
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  let vault = null;

  fetch("vault.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((v) => { vault = v; })
    .catch(() => {
      say("No vault here yet. Run scripts/seal.mjs and push.", "warm");
      $("go").disabled = true;
    });

  async function open(passphrase) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(vault.kdf.salt), iterations: vault.kdf.iterations, hash: vault.kdf.hash },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(vault.iv) }, key, bytes(vault.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function render(docs) {
    if (docs.length === 1) {
      $("gate").style.display = "none";
      $("frame").style.display = "block";
      $("frame").srcdoc = docs[0].html;
      return;
    }
    const list = $("list");
    list.innerHTML = "";
    docs.forEach((d, i) => {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = d.title;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        $("gate").style.display = "none";
        $("frame").style.display = "block";
        $("frame").srcdoc = docs[i].html;
      });
      list.appendChild(a);
    });
    $("form").style.display = "none";
    list.style.display = "flex";
    say("");
  }

  async function attempt(passphrase, quiet) {
    $("go").disabled = true;
    say("Working. The key derivation is deliberately slow.", "cool");
    try {
      const docs = await open(passphrase);
      sessionStorage.setItem("keep.pass", passphrase);
      render(docs);
    } catch (e) {
      sessionStorage.removeItem("keep.pass");
      $("go").disabled = false;
      if (quiet) { say(""); return; }
      say("That isn't it.", "warm");
      $("gate").classList.remove("shake");
      void $("gate").offsetWidth;
      $("gate").classList.add("shake");
      $("pass").select();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const p = $("pass").value;
    if (p && vault) attempt(p, false);
  });

  // Survive a refresh within the tab, not beyond it.
  const held = sessionStorage.getItem("keep.pass");
  if (held) {
    const wait = setInterval(() => {
      if (!vault) return;
      clearInterval(wait);
      attempt(held, true);
    }, 60);
  }
</script>
</body>
</html>
